<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#27479A">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src blob:; worker-src blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; object-src 'none'; base-uri 'none'; form-action 'self'">

<title>GB Independence Day Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#16202C; --muted:#5B6877; --line:#D9DFE6;
  --accent:#27479A; --accent-ink:#FFFFFF; --accent-soft:#E4EAF8;
  --ok:#17663A; --ok-bg:#DDF3E4; --warn:#7A4E00; --warn-bg:#FCEBC8; --bad:#9B1C2B; --bad-bg:#FADADD; --done:#4A5562; --done-bg:#E6E9EE;
  --display:"Fraunces",Georgia,serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1620; --surface:#18222F; --ink:#E8EDF3; --muted:#98A5B5; --line:#2B3949;
  --accent:#8FA8F0; --accent-ink:#0F1620; --accent-soft:#222E4A;
  --ok:#7FD6A1; --ok-bg:#17382A; --warn:#F0C46A; --warn-bg:#3F3217; --bad:#F29AA5; --bad-bg:#432026; --done:#B6C0CC; --done-bg:#243040; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-block:max(12px,env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:600 21px/1.2 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on .dot{background:var(--ok)}
.strip{display:grid;gap:8px}
.strip.s2{grid-template-columns:repeat(2,minmax(0,1fr))}.strip.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--line);padding:4px;border-radius:12px}
nav button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:11px 6px;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
label input,label select,label textarea{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
label.check{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
label.check input{width:22px;height:22px;flex-shrink:0}
#q{font-size:18px;padding:14px 16px;border-width:2px}
.btn{display:block;text-align:center;text-decoration:none;font:600 15px var(--body);border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:13px 16px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{display:inline-block;width:auto;padding:8px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.g{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.g.done{background:var(--done-bg)}
.g.rev{opacity:.7}
.g.has-tk{display:flex;align-items:stretch}
.g-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;width:100%;border:0;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer;min-width:0}
.tkb{border:0;border-left:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font:700 13px var(--body);padding:0 14px;cursor:pointer;flex-shrink:0}
.g-name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.g-meta{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.done{background:var(--done-bg);color:var(--done);border:1px solid var(--line)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.g-act{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.due{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.due b{font-size:22px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:11px 8px;border-radius:10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper .ctl{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer}
.stepper output{min-width:32px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.steps{text-align:left;margin:10px auto 0;padding-left:20px;max-width:340px;color:var(--ink)}
.steps li{margin:4px 0}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.banner .row{display:flex;gap:8px}
.banner input{color:var(--ink)}
.banner .btn{border-color:currentColor;background:transparent;color:inherit}
.verdict{display:flex;gap:14px;align-items:center;border-radius:12px;padding:16px}
.verdict .ic{flex-shrink:0;width:52px;height:52px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-size:28px;font-weight:700;line-height:1}
.verdict b{display:block;font-size:22px;line-height:1.2}
.verdict span{color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.warn{background:var(--warn-bg);color:var(--warn)} .verdict.bad{background:var(--bad-bg);color:var(--bad)}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-height:48vh;width:100%;outline:5px solid transparent;outline-offset:-5px;transition:outline-color .15s}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:16% 16%;border:3px solid rgba(255,255,255,.85);border-radius:16px;pointer-events:none}
.cam .tools{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:8px;justify-content:space-between}
.cam .tools button{background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:8px 14px;font:600 13px var(--body);cursor:pointer}
.cam.f-ok{outline-color:#2ECC71}.cam.f-warn{outline-color:#F5B301}.cam.f-bad{outline-color:#E5484D}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters .chip{white-space:nowrap;padding:8px 12px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rows{display:flex;flex-direction:column}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rows div:last-child{border-bottom:0}
h2{font:600 17px var(--display);margin:0 0 6px}
.logrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.logrow .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(8,12,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.ticket{background:#FFFFFF;color:#16202C;border:1px solid #D9DFE6;border-radius:16px;overflow:hidden;text-align:center}
.tk-top{background:#27479A;color:#FFFFFF;padding:14px 12px}
.tk-top b{display:block;font:600 19px/1.2 "Fraunces",Georgia,serif}
.tk-top span{display:block;font-size:12px;opacity:.92;margin-top:4px}
.tk-qr{padding:16px 24px 6px}
.tk-qr svg{display:block;width:100%;max-width:250px;height:auto;margin:0 auto}
.tk-code{font:700 20px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;margin-top:2px}
.tk-name{font:600 20px/1.2 "Fraunces",Georgia,serif;margin-top:12px;padding:0 12px;overflow-wrap:anywhere}
.tk-meta{font-size:13px;color:#4A5562;margin:4px 12px 0}
.tk-foot{font-size:12px;color:#4A5562;padding:12px 12px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.toast.err{background:var(--bad);color:#fff}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.login{max-width:380px;margin:6vh auto 0;display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.demo{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 14px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.g,.pill,.chip{transition:background .15s}}
</style>

			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}

	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {

							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}

						if (mask) {
							dark = !dark;
						}

						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

/* ============================================================
   DATA LAYER: Firebase (shared) or Demo (this device only)
   ============================================================ */
async function makeFirebaseStore(cfg) {
  const B = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [appM, authM, fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const app = appM.initializeApp(cfg), auth = authM.getAuth(app);
  const db = fs.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  const gref = c => fs.doc(db, 'guests', c);
  return {
    mode: 'firebase',
    onUser(cb) { return authM.onAuthStateChanged(auth, u => cb(u ? { email: (u.email || '').toLowerCase() } : null)); },
    login: (e, p) => authM.signInWithEmailAndPassword(auth, e, p),
    logout: () => authM.signOut(auth),
    watch(kind, cb, err) {
      if (kind === 'config') return fs.onSnapshot(fs.doc(db, 'config', 'event'), s => cb(s.exists() ? s.data() : {}), err);
      if (kind === 'guests') return fs.onSnapshot(fs.collection(db, 'guests'), s => cb(s.docs.map(d => ({ ...d.data(), code: d.id }))), err);
      return fs.onSnapshot(fs.query(fs.collection(db, 'scans'), fs.orderBy('t', 'desc'), fs.limit(300)), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), err);
    },
    setConfig: o => fs.setDoc(fs.doc(db, 'config', 'event'), clean(o)),
    async getGuest(code) { const s = await fs.getDoc(gref(code)); return s.exists() ? { ...s.data(), code } : null; },
    async createGuest(data) {
      for (let i = 0; i < 6; i++) {
        const code = newCode();
        const ok = await fs.runTransaction(db, async tx => {
          if ((await tx.get(gref(code))).exists()) return false;
          tx.set(gref(code), clean({ ...data, code }));
          return true;
        });
        if (ok) return code;
      }
      throw new Error('Could not create a unique ticket code. Try again.');
    },
    updateGuest: (code, patch) => fs.updateDoc(gref(code), clean(patch)),
    deleteGuest: code => fs.deleteDoc(gref(code)),
    async bulkUpdate(list) {
      for (let i = 0; i < list.length; i += 400) {
        const b = fs.writeBatch(db);
        list.slice(i, i + 400).forEach(x => b.update(gref(x.code), clean(x.patch)));
        await b.commit();
      }
    },
    checkIn(code, want, by) {
      return fs.runTransaction(db, async tx => {
        const ref = gref(code), s = await tx.get(ref);
        if (!s.exists()) return { result: 'notfound' };
        const g = { ...s.data(), code };
        if (g.status === 'revoked') return { result: 'revoked', guest: g };
        if (!g.paidFull) return { result: 'unpaid', guest: g };
        const rem = (+g.heads || 0) - (+g.arrived || 0);
        if (rem <= 0) return { result: 'used', guest: g };
        const n = Math.min(Math.max(1, want || rem), rem), now = Date.now();
        tx.update(ref, { arrived: (+g.arrived || 0) + n, arrivedAt: now, lastBy: by, lastN: n });
        return { result: 'ok', n, guest: { ...g, arrived: (+g.arrived || 0) + n, arrivedAt: now, lastBy: by, lastN: n } };
      });
    },
    async reissue(code, by) {
      for (let i = 0; i < 6; i++) {
        const nc = newCode();
        const res = await fs.runTransaction(db, async tx => {
          const os = await tx.get(gref(code));
          if (!os.exists()) throw new Error('Ticket not found');
          const o = os.data();
          if (o.status === 'revoked') throw new Error('This ticket is already cancelled');
          if ((await tx.get(gref(nc))).exists()) return null;
          tx.set(gref(nc), clean({ ...o, code: nc, status: 'active', replacedBy: null, reissuedFrom: code, createdAt: Date.now(), createdBy: by }));

        });

      }
      throw new Error('Could not create a unique ticket code. Try again.');
    },
    logScan: e => fs.addDoc(fs.collection(db, 'scans'), clean(e))
  };
}

function makeDemoStore() {

const cam = { stream: null, running: false, facing: 'environment', det: null, busy: false, last: { key: '', t: 0 }, raf: 0, lastTick: 0, canvas: document.createElement('canvas'), torch: false };
let jsqrP = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve(true);
  if (jsqrP) return jsqrP;
  const urls = ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js', 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'];

    for (const u of urls) {
      const ok = await new Promise(res => { const s = document.createElement('script'); s.src = u; s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); });
      if (ok && window.jsQR) return true;
    }
    jsqrP = null; return false;

}
function camNote(t) { $('#camnote').textContent = t || ''; }
async function camStart() {

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camNote(window.isSecureContext ? 'This browser cannot open the camera. Use Scan from photo, or type the ticket code.' : 'The camera needs a secure (https) address. Open the GitHub Pages link, not a local file.'); return; }
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: cam.facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    camNote(e && e.name === 'NotAllowedError' ? 'Camera permission is blocked. Allow the camera for this site in the browser settings, then tap Start again.' : (e && e.name === 'NotFoundError' ? 'No camera found on this device.' : 'Could not start the camera: ' + errMsg(e)));
    return;
  }
  const v = $('#vid'); v.srcObject = cam.stream;
  try { await v.play(); } catch (e) {}
  cam.running = true; camNote('');
  $('#cam').hidden = false; $('#camstart').hidden = true;
  cam.det = null;
  if ('BarcodeDetector' in window) { try { cam.det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { cam.det = null; } }
  if (!cam.det) { const ok = await loadJsQR(); if (!ok) camNote('The QR reader could not load. Check the internet connection, or use Scan from photo.'); }
  const tr = cam.stream.getVideoTracks()[0], caps = tr && tr.getCapabilities ? tr.getCapabilities() : {};
  $('#torchbtn').hidden = !caps.torch; cam.torch = false;
  cam.raf = requestAnimationFrame(camTick);
}
function camStop() {
  cam.running = false; cancelAnimationFrame(cam.raf);
  if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  cam.stream = null; const v = $('#vid'); v.srcObject = null;
  $('#cam').hidden = true; $('#camstart').hidden = false;
}

async function scanFrame(v) {
  if (cam.det) { const r = await cam.det.detect(v); return r && r.length ? r[0].rawValue : null; }
  if (!window.jsQR) return null;
  const w0 = v.videoWidth, h0 = v.videoHeight; if (!w0 || !h0) return null;

function onDecoded(text) {

async function decodePhoto(file) {
  const bmp = await createImageBitmap(file);

  if (!(await loadJsQR())) throw new Error('The QR reader could not load. Check the internet connection.');
  for (const max of [1000, 1600, 600]) {
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);

    const cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(bmp, 0, 0, w, h);
    const r = window.jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });

}

}
function waText(g) {

}
function waUrl(g) {
  let p = digits(g.phone); if (p.startsWith('00')) p = p.slice(2); if (p.length === 8) p = '968' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(waText(g))}`;
}
function ticketSheet(g, fresh) {

  openSheet(`<h2>${fresh ? 'Payment recorded. Ticket ready' : 'QR ticket'}</h2>
    <div class="ticket">${ticketCardHtml(g)}</div>

    <button class="btn ghost" data-act="close">Done</button>`);

function makeTicketBlob(g) {
  const W = 900, H = 1320, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#27479A'; c.fillRect(0, 0, W, 250);
  c.fillStyle = '#FFFFFF'; c.textAlign = 'center';
  const words = String(CFG.eventName).split(' '); let l1 = words.slice(0, Math.ceil(words.length / 2)).join(' '), l2 = words.slice(Math.ceil(words.length / 2)).join(' ');
  c.font = '600 54px Fraunces, Georgia, serif'; c.fillText(l1, W / 2, 85); c.fillText(l2, W / 2, 150);
  c.font = '27px "Public Sans", Arial, sans-serif'; c.fillText([CFG.featuring, CFG.tagline].filter(Boolean).join(' · '), W / 2, 205);
  const q = QRLib.make(ticketUrl(g.code)), n = q.getModuleCount(), cell = Math.floor(640 / (n + 8)), size = cell * (n + 8), x0 = Math.round((W - size) / 2), y0 = 285;
  c.fillStyle = '#FFFFFF'; c.fillRect(x0, y0, size, size); c.fillStyle = '#000000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) c.fillRect(x0 + (k + 4) * cell, y0 + (r + 4) * cell, cell, cell);
  const by = y0 + size + 60;
  c.fillStyle = '#16202C'; c.font = '700 54px ui-monospace, Menlo, Consolas, monospace'; c.fillText(fmtCode(g.code), W / 2, by);
  if (g.name) { c.font = '600 56px Fraunces, Georgia, serif'; c.fillText(String(g.name).slice(0, 28), W / 2, by + 90); }
  const gn = +g.heads || 1;
  c.fillStyle = '#4A5562'; c.font = '34px "Public Sans", Arial, sans-serif'; c.fillText(`${gn} ${gn === 1 ? 'guest' : 'guests'} · Paid`, W / 2, by + 145);
  c.font = '30px "Public Sans", Arial, sans-serif';
  c.fillText(CFG.venue + (S.cfg.date || g.date ? ' · ' + (S.cfg.date || g.date) : ''), W / 2, by + 205);
  c.fillText('Show this QR code at the entrance', W / 2, by + 250);
  return new Promise(res => cv.toBlob(res, 'image/png'));
}
const ticketFile = g => 'ticket-' + (String(g.name || 'guest').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'guest') + '.png';
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();

async function collectAndAdmit(code) {
  const g = byCode(code), st = ui[code] || {}; if (!g || !priced()) return;
  if (!st.method) { toast('Choose how the guest paid', true); return; }
  const due = dueOf(g), n = Math.min(Math.max(1, st.n || remOf(g)), remOf(g));
  try { await Store.updateGuest(code, { paid: due, due, paidFull: true, method: st.method, collectedBy: S.user.email, paidAt: Date.now() }); }
  catch (e) { toast('Could not record payment: ' + niceErr(e), true); return; }
  await admit(code, n);
}
async function savePrice(btn) {
  const price = parseFloat($('#price').value), date = $('#evdate').value.trim();
  if (isNaN(price) || price < 0) { toast('Enter the price per head', true); return; }
  const changed = !priced() || price !== S.cfg.price;
  // Bookings that already have a payment keep the price they were booked at, so issued tickets stay valid.
  const list = changed ? live().filter(g => paidOf(g) <= 0).map(g => ({ code: g.code, patch: { due: (+g.heads || 0) * price, paidFull: false } }))
    .filter(x => { const g = byCode(x.code); return +g.due !== x.patch.due; }) : [];
  if (priced() && changed && list.length && !btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = `Tap again to update ${list.length} unpaid bookings`; return; }
  try {
    await Store.setConfig({ price, date });
    if (list.length) await Store.bulkUpdate(list);
    toast('Settings saved'); delete btn.dataset.sure; btn.textContent = 'Save settings';
  } catch (e) { toast('Could not save: ' + niceErr(e), true); }
}

document.addEventListener('click', async ev => {
  const tb = ev.target.closest('[data-tab]'); if (tb) { showTab(tb.dataset.tab); return; }
  const b = ev.target.closest('[data-act]'); if (!b) { if (ev.target.id === 'overlay') closeSheet(); return; }

      case 'demo-admin': Store.demoLogin('admin'); break;
      case 'demo-gate': Store.demoLogin('gate'); break;
      case 'logout': camStop(); await Store.logout(); break;
      case 'camstart': camStart(); break;
      case 'camstop': camStop(); break;
      case 'flip': cam.facing = cam.facing === 'environment' ? 'user' : 'environment'; if (cam.running) { camStop(); await camStart(); } break;
      case 'torch': { const tr = cam.stream && cam.stream.getVideoTracks()[0]; if (tr) { cam.torch = !cam.torch; try { await tr.applyConstraints({ advanced: [{ torch: cam.torch }] }); } catch (e) { toast('Torch not available', true); } } break; }
      case 'photo': $('#scanfile').click(); break;
      case 'toggle': S.openId = S.openId === id ? null : id; if (S.verdict && S.verdict.code !== id) S.verdict = null; renderScan(); break;
      case 'method': (ui[id] ||= {}).method = b.dataset.m; renderScan(); break;
      case 'inc': case 'dec': { const g = byCode(id), st = (ui[id] ||= {}); st.n = Math.min(remOf(g), Math.max(1, (st.n || 1) + (a === 'inc' ? 1 : -1))); renderScan(); break; }
      case 'admit': admit(id, (ui[id] || {}).n || remOf(byCode(id))); break;
      case 'collect': collectAndAdmit(id); break;
      case 'undo': { const g = byCode(id); await Store.updateGuest(id, { arrived: Math.max(0, inOf(g) - (+g.lastN || 0)), lastN: 0 }); S.verdict = null; toast('Last entry undone'); break; }
      case 'walkin': walkinSheet(); break;
      case 'winc': overlayState.n = Math.min(50, overlayState.n + 1); walkinUpdate(); break;
      case 'wdec': overlayState.n = Math.max(1, overlayState.n - 1); walkinUpdate(); break;
      case 'wmethod': overlayState.method = b.dataset.m; walkinUpdate(); break;
      case 'wsave': walkinSave(b); break;
      case 'add': guestSheet(null); break;
      case 'edit': guestSheet(id); break;
      case 'gsave': guestSave(b); break;
      case 'ticket': { const g = byCode(id); if (g) ticketSheet(g, false); break; }
      case 'ticketfrom': { const g = byCode(overlayState.code); if (g) ticketSheet(g, false); break; }
      case 'reissue':
        if (b.dataset.sure) { try { const nc = await Store.reissue(overlayState.code, S.user.email); closeSheet(); toast('New QR code issued. The old one is cancelled.'); setTimeout(() => { const g = byCode(nc); if (g && g.paidFull) ticketSheet(g, false); }, 500); } catch (e) { toast(niceErr(e), true); } }
        else { b.dataset.sure = '1'; b.textContent = 'Tap again to cancel the old QR and issue a new one'; }

        else { b.dataset.sure = '1'; b.textContent = 'Tap again to cancel this booking'; }
        break;
      case 'gdel':
        if (b.dataset.sure) { await Store.deleteGuest(overlayState.code); closeSheet(); toast('Record deleted'); }
        else { b.dataset.sure = '1'; b.textContent = 'Tap again to delete for good'; }
        break;
      case 'tkshare': ticketShare(); break;
      case 'tkpng': ticketSave(); break;
      case 'tkcopy': if (overlayState.ticket) copyText(personalLink(overlayState.ticket)); break;
      case 'gt-save': if (overlayState.ticket) downloadBlob(await overlayState.png, ticketFile(overlayState.ticket)); break;
      case 'import': importSheet(); break;
      case 'doimport': doImport(b); break;
      case 'close': closeSheet(); break;
      case 'filter': S.filter = b.dataset.k; renderGuests(); break;
      case 'logfilter': S.logFilter = b.dataset.k; renderLog(); break;

    }
  } catch (e) { toast(niceErr(e), true); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) closeSheet(); });
$('#auto').addEventListener('change', e => { S.auto = e.target.checked; lsSet('gbid-auto', S.auto ? '1' : '0'); });
$('#q').addEventListener('input', () => {
  S.verdict = null; S.openId = null;
  const v = $('#q').value, c = parseCode(v);
  if (c && (/[#&?]/.test(v) || byCode(c))) { handleCode(v); return; }
  renderScan();
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const c = parseCode($('#q').value); if (c) handleCode($('#q').value); } });
$('#gq').addEventListener('input', renderGuests);
$('#scanfile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('Reading ticket…');
  try { const t = await decodePhoto(f); if (t) { $('#toast').hidden = true; handleCode(t); } else toast('Could not read a QR code. Retake the photo closer and in good light.', true); }
  catch (err) { toast(errMsg(err), true); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && cam.running) camStop(); });

/* ============================================================
   LOGIN AND START
   ============================================================ */
function showView(v) { ['boot', 'login', 'main', 'ticket'].forEach(x => $('#v-' + x).hidden = x !== v); }
function showLogin() {
  unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = [];
  S.user = null; S.admin = false; S.loaded = false; S.guests = []; S.scans = []; S.verdict = null; S.openId = null;
  $('#l-title').textContent = CFG.eventName; $('#l-sub').textContent = [CFG.featuring, CFG.venue].filter(Boolean).join(' · ');
  const demo = Store.mode === 'demo';
  $('#l-form').hidden = demo; $('#l-roles').hidden = !demo; $('#l-demo').hidden = !demo;
  $('#l-demo').textContent = 'Demo mode: no Firebase settings found, so data stays on this device only. Choose a role to try the app.';
  $('#l-err').textContent = ''; showView('login');
}
function showMain(u) {
  S.user = u;
  S.admin = Store.mode === 'demo' ? u.demoRole === 'admin' : (CFG.adminEmails || []).map(x => String(x).toLowerCase()).includes(u.email);
  S.tab = 'scan'; S.conn = 'Connecting'; S.loaded = false;
  $('#demo-note').hidden = Store.mode !== 'demo';
  $('#auto').checked = S.auto;
  $('#h-title').textContent = CFG.eventName;
  showView('main'); renderNav(); renderAll();
  const onErr = what => e => { S.conn = 'Offline'; renderHeader(); toast(what + ': ' + niceErr(e), true); };
  unsubs.push(Store.watch('config', c => { S.cfg = { price: c && c.price != null ? +c.price : DEFAULT_PRICE, date: (c && c.date) || '' }; renderAll(); }, onErr('Settings')));
  unsubs.push(Store.watch('guests', gs => {
    S.guests = gs; S.loaded = true; S.conn = 'Live';
    if (S.openId && !byCode(S.openId)) S.openId = null;
    renderAll();
    if (S.pending) { const c = S.pending; S.pending = null; handleCode(c); }
  }, onErr('Guest list')));
  if (S.admin) unsubs.push(Store.watch('scans', s => { S.scans = s; if (S.tab === 'log') renderLog(); }, onErr('Scan log')));
}
$('#l-form').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('#l-go'); btn.disabled = true; $('#l-err').textContent = '';
  try { const u0 = $('#l-email').value.trim().toLowerCase(); await Store.login(u0.includes('@') ? u0 : u0 + '@gbevent.com', $('#l-pass').value); }
  catch (err) {
    const c = (err && err.code) || '';
    $('#l-err').textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? 'Wrong username or password.' : /too-many/.test(c) ? 'Too many attempts. Wait a few minutes and try again.' : /network/.test(c) ? 'No connection. Check the internet and try again.' : 'Could not sign in: ' + errMsg(err);
  } finally { btn.disabled = false; }
});
function readHash() {
  const h = location.hash || '';
  if (/^#my=/.test(h)) {
    const p = new URLSearchParams(h.slice(1)), code = (p.get('my') || '').toUpperCase();
    if (CODE_RE.test(code)) return { type: 'guest', code, name: p.get('n') || '', heads: +p.get('g') || 1 };
  }
  const m = h.match(/^#t-([A-Za-z0-9]{10})$/);
  return m ? { type: 'verify', code: m[1].toUpperCase() } : null;
}
(async function boot() {
  const hv = readHash();
  if (hv && hv.type === 'guest') { showGuestTicket(hv); return; }
  if (hv && hv.type === 'verify') { S.pending = hv.code; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  try {
    Store = (CFG.firebase && CFG.firebase.apiKey) ? await makeFirebaseStore(CFG.firebase) : makeDemoStore();
  } catch (e) {
    $('#v-boot').innerHTML = '<div class="center">Could not load the database. Check the internet connection and the Firebase settings in this page, then reload.</div>'; return;
  }
  Store.onUser(u => { if (!u) showLogin(); else showMain(u); });
})();
})();
</script>
</body>
